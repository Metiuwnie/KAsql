name: kasql_flutter
description: "KAsql Mobile — Aplikasi Akuntansi Keuangan"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP Client
  dio: ^5.7.0

  # State Management
  provider: ^6.1.0

  # Firebase Auth
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1

  # Local Storage
  sqflite: ^2.4.2
  path: ^1.9.0
  flutter_secure_storage: ^9.2.4

  # Network Connectivity
  connectivity_plus: ^6.1.4

  # Charts
  fl_chart: ^0.70.2

  # Google Fonts
  google_fonts: ^6.2.1

  # Internationalization
  intl: ^0.19.0

  # Shimmer Loading
  shimmer: ^3.0.0
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
